name: Release plugin

# Every push to main publishes the version in manifest.json: the tag and the
# GitHub release are created if they do not exist yet, otherwise the release
# assets are replaced. Bump the version for BRAT to offer an update.
on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run typecheck && npm run lint && npm test && npm run build

      - name: Resolve release version
        id: version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "${manifest_version}" = "${package_version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME}" = "${manifest_version}"; fi
          echo "version=${manifest_version}" >> "${GITHUB_OUTPUT}"

      # Attestations are unavailable on some plans (e.g. private repositories
      # on free accounts); they must not block the release.
      - name: Attest main.js
        uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: dist/main.js

      - name: Attest styles.css
        uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: dist/styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "${VERSION}" dist/main.js dist/manifest.json dist/styles.css \
              --target "${GITHUB_SHA}" --title "Notion Import ${VERSION}" --generate-notes
          fi
